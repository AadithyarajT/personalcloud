{% extends 'base.html' %}
{% block title %}Edit Profile — PersonalCloud{% endblock %}
{% block content %}
<div class="page-container narrow">
  <div class="form-card">
    <h1 class="form-card-title">Edit Profile</h1>
    <form method="post" enctype="multipart/form-data" class="auth-form">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label for="id_first_name">First Name</label>
          <input type="text" name="first_name" id="id_first_name" class="form-input" value="{{ form.first_name.value|default:'' }}">
        </div>
        <div class="form-group">
          <label for="id_last_name">Last Name</label>
          <input type="text" name="last_name" id="id_last_name" class="form-input" value="{{ form.last_name.value|default:'' }}">
        </div>
      </div>
      <div class="form-group">
        <label for="id_email">Email</label>
        <input type="email" name="email" id="id_email" class="form-input" value="{{ form.email.value|default:'' }}" required>
      </div>
      <div class="form-group">
        <label for="id_bio">Bio</label>
        <textarea name="bio" id="id_bio" class="form-input form-textarea" placeholder="Tell us about yourself...">{{ form.bio.value|default:'' }}</textarea>
      </div>
      <div class="form-group">
        <label for="id_avatar">Profile Picture</label>
        {% if user.profile.avatar %}
          <img src="{{ user.profile.avatar.url }}" alt="Current avatar" class="current-avatar-preview">
        {% endif %}
        <input type="file" name="avatar" id="id_avatar" class="form-input file-input" accept="image/*">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">Save Changes</button>
        <a href="{% url 'profile' %}" class="btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
