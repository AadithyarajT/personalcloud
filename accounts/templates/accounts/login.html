{% extends 'base.html' %}
{% block title %}Login — PersonalCloud{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">☁</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your personal cloud</p>
    </div>
    <form method="post" class="auth-form" id="loginForm" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-input" placeholder="your username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="id_password">Password</label>
        <div class="input-with-toggle">
          <input type="password" name="password" id="id_password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-password" data-target="id_password">👁</button>
        </div>
      </div>
      {% if form.non_field_errors %}
      <div class="form-error">{{ form.non_field_errors }}</div>
      {% endif %}
      <button type="submit" class="btn-primary btn-full">Sign In</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
  </div>
</div>
{% endblock %}
